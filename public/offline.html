<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - LipaPoint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon-wrap {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(245, 158, 11, 0.1);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 24px;
    }
    .icon-wrap svg { width: 40px; height: 40px; color: #f59e0b; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: #a1a1aa; max-width: 400px; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #d4a017; color: #09090b; font-weight: 600;
      padding: 10px 20px; border-radius: 8px; border: none;
      font-size: 14px; cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: #b8860b; }
    .btn svg { width: 16px; height: 16px; }
    .hint { font-size: 12px; color: #71717a; margin-top: 16px; }
    .pos-link {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 12px; color: #d4a017; font-size: 13px;
      text-decoration: none; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M8.288 4.882A9.97 9.97 0 0112 4c4.03 0 7.513 2.388 9.116 5.824a.75.75 0 010 .352 12.004 12.004 0 01-1.94 3.36M6.382 6.382A11.95 11.95 0 002.884 10.176a.75.75 0 000 .352A9.996 9.996 0 0012 16c1.29 0 2.527-.244 3.66-.688" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M1 1l4.95 4.95M19.05 19.05L23 23" />
    </svg>
  </div>
  <h1>You're Offline</h1>
  <p>No internet connection detected. Don't worry — your POS is still functional for processing sales.</p>
  <button class="btn" onclick="window.location.reload()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
    </svg>
    Try Again
  </button>
  <p class="hint">Sales made offline will sync automatically when your connection returns.</p>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
